function baseProd(k,b,pf){if(!PROD[b.t])return;const now=Date.now(),h=clamp((now-(b.ts||now))/3.6e6,0,72);b.ts=now;b.st=Math.min(60,(b.st||0)+h*PROD[b.t][1]*pf)}
